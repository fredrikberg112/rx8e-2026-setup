<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RX8E 2026 Setup Sheet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e94560;
    }
    
    .header h1 {
      color: #e94560;
      font-size: 1.8rem;
    }
    
    .header-buttons {
      display: flex;
      gap: 10px;
    }
    
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #c23a51;
      transform: translateY(-2px);
    }
    
    .btn-new { background: #0f3460; }
    .btn-new:hover { background: #164579; }
    
    .btn-default { background: #533483; }
    .btn-default:hover { background: #6b4599; }
    
    .btn-save { background: #27ae60; }
    .btn-save:hover { background: #219a52; }
    
    .btn-export { background: #f39c12; }
    .btn-export:hover { background: #d68910; }
    
    .btn-close { background: #7f8c8d; }
    .btn-close:hover { background: #6c7a7b; }
    
    .btn-danger { background: #e74c3c !important; }
    .btn-danger:hover { background: #c0392b !important; }
    
    .btn-small {
      padding: 5px 10px;
      font-size: 12px;
    }
    
    .setup-list {
      margin-top: 20px;
    }
    
    .setup-list h3 {
      color: #e94560;
      margin-bottom: 15px;
    }
    
    .setups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }
    
    .setup-card {
      background: #16213e;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .setup-card:hover {
      border-color: #e94560;
      transform: translateY(-3px);
    }
    
    .setup-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .setup-card-header strong {
      color: #e94560;
      font-size: 1.1rem;
    }
    
    .setup-date {
      color: #888;
      font-size: 0.85rem;
    }
    
    .setup-card-track {
      color: #aaa;
      margin-bottom: 10px;
    }
    
    .setup-card-stats {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: #7f8c8d;
    }
    
    .setup-card-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a4a;
    }
    
    .editor {
      margin-top: 20px;
    }
    
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e94560;
    }
    
    .editor-header h2 {
      color: #e94560;
    }
    
    .editor-actions {
      display: flex;
      gap: 10px;
    }
    
    .setup-form {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .field-group {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
    }
    
    .field-group h4 {
      color: #e94560;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a4a;
    }
    
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .field {
      display: flex;
      flex-direction: column;
    }
    
    .field label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .field label .info {
      cursor: help;
      opacity: 0.5;
    }
    
    .field input, .field select {
      background: #1a1a2e;
      border: 2px solid #2a2a4a;
      color: #eee;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #e94560;
    }
    
    .field .suffix {
      font-size: 0.8rem;
      color: #888;
      margin-left: 5px;
    }
    
    .notes-section {
      margin-top: 20px;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
    }
    
    .notes-section label {
      display: block;
      color: #e94560;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .notes-section textarea {
      width: 100%;
      background: #1a1a2e;
      border: 2px solid #2a2a4a;
      color: #eee;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      min-height: 150px;
      font-family: monospace;
    }
    
    .notes-section textarea:focus {
      outline: none;
      border-color: #e94560;
    }
    
    .empty {
      text-align: center;
      color: #888;
      padding: 40px;
      font-size: 1.1rem;
    }
    
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      
      .setup-form {
        grid-template-columns: 1fr;
      }
      
      .fields-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
